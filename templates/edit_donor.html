{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Donor</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f5f5;
    overflow-x:hidden;
}

nav{
    width:100%;
    background:#b30000;
    padding:18px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:white;
    font-size:32px;
    font-weight:bold;
}

.logo img{
    width:40px;
    height:40px;
    border-radius:50%;
    background:white;
    padding:2px;
    object-fit:cover;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:#ffd6d6;
}

.edit-section{
    width:100%;
    min-height:90vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;
}

.edit-box{
    width:100%;
    max-width:650px;

    background:white;
    padding:40px;
    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.edit-box h1{
    text-align:center;
    color:#b30000;
    margin-bottom:30px;
    font-size:45px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input,
.input-box select{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    font-size:16px;
}

.edit-box button{
    width:100%;
    padding:15px;
    border:none;
    background:#b30000;
    color:white;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
    transition:.4s;
}

.edit-box button:hover{
    background:#700000;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

/* Responsive */

@media(max-width:900px){

    nav{
        padding:15px 20px;
        flex-direction:column;
        gap:15px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    nav ul li a{
        font-size:16px;
    }

    .edit-box{
        padding:30px 20px;
    }

    .edit-box h1{
        font-size:35px;
    }

}

@media(max-width:500px){

    .logo{
        font-size:28px;
    }
    .logo img{
        width: 35px;
        height: 35px;
    }

    .edit-box h1{
        font-size:28px;
    }

    .input-box input,
    .input-box select{
        padding:13px;
        font-size:15px;
    }

    .edit-box button{
        font-size:16px;
    }

}

</style>

</head>

<body>

<nav>

    <div class="logo">

    <img src="{% static 'images/blood.jpg' %}" alt="Logo">

    <span>BloodBank</span>

    </div>
    <ul>

        <li>
            <a href="{% url 'admin_dashboard' %}">
                Dashboard
            </a>
        </li>

        <li>
            <a href="{% url 'manage_donors' %}">
                Manage Donors
            </a>
        </li>

        <li>
            <a href="{% url 'manage_requests' %}">
                Manage Requests
            </a>
        </li>

        <li>
            <a href="{% url 'logout' %}">
                Logout
            </a>
        </li>

    </ul>

</nav>

<section class="edit-section">

    <div class="edit-box">

        <h1>Edit Donor</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <input type="text"
                       name="name"
                       value="{{ donor.name }}"
                       placeholder="Enter Name"
                       required>

            </div>

            <div class="input-box">

                <input type="tel"
                       name="phone"
                       value="{{ donor.phone }}"
                       placeholder="Enter Phone Number"
                       required>

            </div>

            <div class="input-box">

                <select name="blood_group" required>

                    <option value="{{ donor.blood_group }}">
                        {{ donor.blood_group }}
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

            </div>

            <button type="submit">
                Update Donor
            </button>

        </form>

    </div>

</section>

<footer>

    <p>
        Blood Bank Management System © 2026
    </p>

</footer>

</body>
</html>
