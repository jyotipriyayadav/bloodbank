{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Update Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f5f5f5;
    overflow-x:hidden;
}

nav{
    width:100%;
    background:#b30000;
    padding:18px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:32px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
    transition:.3s;
}

nav ul li a:hover{
    color:#ffd6d6;
}

.update-section{
    width:100%;
    min-height:90vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.update-box{
    width:100%;
    max-width:650px;
    background:white;
    padding:40px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.1);
}

.update-box h1{
    text-align:center;
    color:#b30000;
    margin-bottom:30px;
    font-size:45px;
}

.input-box{
    margin-bottom:20px;
}

.input-box input,
.input-box select{
    width:100%;
    padding:15px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    font-size:16px;
}

.update-box button{
    width:100%;
    padding:15px;
    border:none;
    background:#b30000;
    color:white;
    font-size:18px;
    border-radius:6px;
    cursor:pointer;
    transition:.4s;
}

.update-box button:hover{
    background:#700000;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

.msg-box{
    color:white;
    padding:15px;
    text-align:center;
    font-size:18px;
}

.success{
    background:green;
}

.error{
    background:red;
}

/* Responsive */

@media(max-width:900px){

    nav{
        padding:15px 20px;
        flex-direction:column;
        gap:15px;
    }

    nav ul{
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
    }

    nav ul li a{
        font-size:16px;
    }

    .update-box{
        padding:30px 20px;
    }

    .update-box h1{
        font-size:35px;
    }

}

@media(max-width:500px){

    .logo{
        font-size:28px;
    }

    .update-section{
        padding:30px 15px;
    }

    .update-box h1{
        font-size:28px;
    }

    .input-box input,
    .input-box select{
        padding:13px;
        font-size:15px;
    }

    .update-box button{
        font-size:16px;
        padding:13px;
    }

}

</style>

</head>

<body>

{% if messages %}

    {% for message in messages %}

        <div class="msg-box
             {% if message.tags == 'success' %}
                 success
             {% else %}
                 error
             {% endif %}">

            {{ message }}

        </div>

    {% endfor %}

{% endif %}

<nav>

    <div class="logo">
        BloodBank
    </div>

    <ul>

        <li>
            <a href="{% url 'donor_dashboard' %}">
                Dashboard
            </a>
        </li>

        <li>
            <a href="{% url 'donate_blood' %}">
                Donate Blood
            </a>
        </li>

        <li>
            <a href="{% url 'logout' %}">
                Logout
            </a>
        </li>

    </ul>

</nav>

<section class="update-section">

    <div class="update-box">

        <h1>Update Profile</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">

                <input type="text"
                       name="name"
                       value="{{ user.name }}"
                       placeholder="Enter Name"
                       required>

            </div>

            <div class="input-box">

                <input type="email"
                       name="email"
                       value="{{ user.email }}"
                       placeholder="Enter Email"
                       required>

            </div>

            <div class="input-box">

                <input type="tel"
                       name="phone"
                       value="{{ user.phone }}"
                       placeholder="Enter Phone Number"
                       required>

            </div>

            <div class="input-box">

                <select name="blood_group" required>

                    <option value="{{ user.blood_group }}">
                        {{ user.blood_group }}
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

            </div>

            <button type="submit">
                Update Profile
            </button>

        </form>

    </div>

</section>

<footer>

    <p>
        Blood Bank Management System © 2026
    </p>

</footer>

<script>

setTimeout(function(){

    let msgs=document.querySelectorAll(".msg-box");

    msgs.forEach(function(msg){

        msg.style.display="none";

    });

},2000);

</script>

</body>
</html>
